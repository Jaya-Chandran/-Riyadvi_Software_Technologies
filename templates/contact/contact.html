{% extends 'base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}

<section class="container py-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold">Contact Us</h1>
        <p>Let's discuss your project.</p>
    </div>

    <div class="row">

        <div class="col-lg-6">

            <form method="POST">

                {% csrf_token %}

                <input
                    type="text"
                    name="name"
                    class="form-control mb-3"
                    placeholder="Your Name"
                    required>

                <input
                    type="email"
                    name="email"
                    class="form-control mb-3"
                    placeholder="Email"
                    required>

                <input
                    type="text"
                    name="phone"
                    class="form-control mb-3"
                    placeholder="Phone"
                    required>

                <input
                    type="text"
                    name="subject"
                    class="form-control mb-3"
                    placeholder="Subject"
                    required>

                <textarea
                    name="message"
                    class="form-control mb-3"
                    rows="5"
                    placeholder="Message"
                    required></textarea>

                <button class="btn btn-warning btn-lg">
                    Send Message
                </button>

            </form>

        </div>

        <div class="col-lg-6">

            <h3>Office</h3>

            <p>Chennai, Tamil Nadu</p><br>

            <h4>Email: <a href="mailto:info@riyadvisoftwaretechnologies.com">info@riyadvisoftwaretechnologies.com</a></h4><br>

            <h5>Phone: <a href="tel:+918072487427">+91 8072487427</a></h5>

        </div>

    </div>

</section>

{% endblock %}
